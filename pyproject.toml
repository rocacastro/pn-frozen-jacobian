[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pn-frozen-jacobian"
version = "1.0.0rc2"
description = "English computational companion to predictor-memory frozen-Jacobian methods, manuscript v0.41"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Rodrigo Castro Marín", email = "rodrigo.castrom@uv.cl"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "mpmath>=1.3,<2", "threadpoolctl>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
